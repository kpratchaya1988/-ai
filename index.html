<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>17:00 Office Escape!</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c1f3a;--bg:#eef3f1;--panel:#fff;--violet:#4b53bc;--note:#ffd447;--red:#e4472e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e9ebff;--bg:#15172b;--panel:#22254a}}
:root[data-theme="dark"]{--ink:#e9ebff;--bg:#15172b;--panel:#22254a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 Prompt,"Noto Sans Thai",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;-webkit-user-select:none;user-select:none}
#hud,#stage{width:min(100vw,calc((100dvh - 64px)*.77),400px)}
#hud{display:flex;align-items:center;gap:10px;padding:8px 10px}
#clk{font-size:26px;font-weight:700;min-width:64px;font-variant-numeric:tabular-nums}
#bar{flex:1;height:18px;border-radius:9px;background:rgba(128,128,128,.28);position:relative;overflow:hidden}
#fill{position:absolute;left:0;top:0;bottom:0;width:0}
#bar span{position:relative;font-size:11px;font-weight:700;line-height:18px;padding-left:8px;color:#1c1f3a}
#sc{font-size:20px;font-weight:700;min-width:56px;text-align:right;font-variant-numeric:tabular-nums}
#stage{position:relative}
#cv{display:block;width:100%;aspect-ratio:400/520;touch-action:none;border-radius:6px;background:#d6e4e0}
#bn{position:absolute;top:8px;left:8px;right:8px;background:var(--violet);color:#fff;border-radius:6px;padding:6px 10px;font-size:13px;font-weight:700;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
#ov{position:absolute;inset:0;display:none;padding:10px;background:rgba(28,31,58,.6);overflow:auto;border-radius:6px}
.card{margin:auto;background:var(--panel);color:var(--ink);width:100%;border-radius:8px;border-top:8px solid var(--violet);padding:0 16px 16px;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.3)}
h1{font-size:26px;margin:14px 0 4px}h2{font-size:21px;margin:4px 0}h3{font-size:15px;margin:12px 0 4px}p{margin:6px 0}
.big{font-size:44px;line-height:1.1;margin-top:10px}
.dim{opacity:.7;font-size:13px}.er{color:var(--red);min-height:1.3em;font-size:13px}
.score{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums}
label{display:block;font-weight:700;margin:10px 0 4px}
input{font:inherit;width:100%;padding:10px;border-radius:6px;border:2px solid var(--violet);background:var(--bg);color:var(--ink);text-align:center;-webkit-user-select:text;user-select:text}
button{font:700 16px Prompt,sans-serif;background:var(--note);color:#1c1f3a;border:0;border-radius:6px;padding:11px 14px;margin:5px 0;width:100%;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.25);touch-action:manipulation}
button:active{transform:translateY(1px)}
button.alt{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--violet)}
button:focus-visible,input:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
.st,.lb{list-style:none;padding:0;margin:6px 0;font-size:14px}
.st li{display:flex;justify-content:space-between}
.lb{counter-reset:n;text-align:left}
.lb li{display:flex;gap:6px;padding:5px 8px;border-bottom:1px solid rgba(128,128,128,.25)}
.lb li::before{counter-increment:n;content:counter(n) ".";width:22px;opacity:.6}
.lb li span:first-of-type{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .me{background:var(--note);color:#1c1f3a;border-radius:4px;font-weight:700}
.rules{text-align:left;font-size:14px}.rules h3{margin:10px 0 2px}.rules ul{margin:2px 0;padding-left:18px}.rules li{margin:2px 0}
@keyframes pop{from{transform:scale(.94);opacity:0}}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes bump{40%{transform:scale(1.3)}}
@keyframes hot{50%{box-shadow:0 0 0 4px rgba(228,71,46,.45)}}
.card{animation:pop .2s ease-out}
.big{animation:bob 1.6s ease-in-out infinite}
#sc.bump{animation:bump .25s}
#bar.hot{animation:hot .6s infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header id="hud"><div id="clk">16:00</div><div id="bar"><i id="fill"></i><span id="fc">Stress</span></div><div id="sc">0</div></header>
<main id="stage"><canvas id="cv" width="400" height="520"></canvas><div id="bn"></div><div id="ov"></div></main>
<script>
(()=>{
const $=i=>document.getElementById(i),cv=$('cv'),g=cv.getContext('2d'),ov=$('ov'),bn=$('bn'),W=400,H=520;
const dpr=Math.min(2,window.devicePixelRatio||1);cv.width=W*dpr;cv.height=H*dpr;g.scale(dpr,dpr);
const R=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0];
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const LS='office17-board';let mem=[];
const load=()=>{try{const v=JSON.parse(localStorage.getItem(LS));return Array.isArray(v)?v:mem}catch(e){return mem}};
const save=a=>{mem=a;try{localStorage.setItem(LS,JSON.stringify(a))}catch(e){}};
const EF='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif',TF='700 13px Prompt,sans-serif';
const DK=[];for(const y of[100,240,380])for(const x of[20,150,280])DK.push([x,y]);
const BOSSQ=['PO ตัวนี้เสร็จยัง?','ขออัปเดตหน่อย','แป๊บเดียวเอง'],POQ=['ขอเพิ่มอีกนิด','เปลี่ยน Requirement นิดเดียว'];
const BT=[{v:4,sp:34,c:'#ffd447',tx:'Minor Bug +4'},{v:10,sp:38,c:'#ff9f43',tx:'Major Bug +10'},{v:16,sp:44,c:'#e4472e',tx:'Works on My Machine +16'}];
const EM=['☕','🎧','🚀','📅'],IT=[0,0,0,0,1,1,2,3];
const RK=[{e:'🥇',n:'Legendary BA',q:'กลับบ้านตรงเวลา'},{e:'🥈',n:'Senior Survivor',q:'โอทีแค่ 1 ชั่วโมง'},{e:'🥉',n:'Junior Hero',q:'ยังอยู่ประชุม'},{e:'💀',n:'Production Slave',q:'กลับบ้าน 22:30'}];
// option = [label, success chance, ok text, ok stress change, ok score, bad text, bad stress]
const EV={
teams:{at:14,ic:'📞',ti:'Incoming Call',tx:'หัวหน้าโทรมา: "แป๊บเดียวเอง"',o:[
['รับสาย',.65,'คุยแค่ 5 นาทีจริงๆ',0,10,'"แป๊บเดียว" กลายเป็น 40 นาที',10],
['ปฏิเสธ',.75,'สายหลุดไปเอง',0,15,'โทรซ้ำอีก 3 รอบ',9],
['ปิดคอมหนี',.50,'หนีรอด! เย็นนี้เงียบสงบ',-8,30,'ยังออนไลน์ในมือถืออยู่...',14]]},
inc:{at:45,ic:'🚨',ti:'Production Down',tx:'ระบบล่มตอน 16:45 จะทำไงดี?',o:[
['Fix เอง',.65,'แก้ได้! ฮีโร่ประจำทีม',-10,60,'แก้ไม่ทัน ลูกค้าโทรมาเอง',25],
['โยนให้ Infra',.55,'Infra: "เดี๋ยวดูให้ครับ"',0,60,'Infra: "ไม่ใช่ของเรานะ"',25],
['แกล้งปิด Teams',.40,'ไม่มีใครหาเจอ!',-15,60,'หัวหน้าเดินมาถึงโต๊ะ',25]]},
fri:{at:55,ic:'📅',ti:'Friday Evening',tx:'PO: "ขอ Feature เล็กๆ ก่อนกลับบ้าน"',o:[
['รับ',.55,'ทำเสร็จเร็วผิดคาด',0,20,'Scope โตเป็นสองเท่า',12],
['ปฏิเสธ',.70,'PO: "โอเค งั้น Monday"',-5,30,'PO: "เดี๋ยวคุยกับหัวหน้า"',12],
['ลาพักร้อนทันที',.65,'ลาผ่าน! หัวหน้ายังไม่เห็น',-10,40,'ระบบลาขึ้นว่า "รออนุมัติ"',15]]}};
const keys={},ptr={d:0,x:0,y:0};let S,last=0,bt,lsc=-1;
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches,parts=[];
const burst=(x,y,c,n)=>{if(RM)n=Math.min(n,4);for(let i=0;i<n;i++){const a=R(0,6.28),v=R(40,150);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:R(.3,.7),max:.7,c,sz:R(2,4.5),g:220})}};
const dust=(x,y)=>{if(!RM)parts.push({x:x+R(-4,4),y,vx:R(-12,12),vy:R(-16,-4),life:.4,max:.4,c:'rgba(120,110,100,.55)',sz:R(2,4),g:0})};
const mix=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t)),rgb=a=>'rgb('+a+')',CL=['#c58b4b','#4b53bc','#2bb3ff','#ff8a3d'],PR=[['🪴',16,190],['🖨️',384,190],['🚰',16,330],['🪴',384,330],['🪴',16,500],['🗄️',384,500]];

function newGame(name){
 Object.keys(keys).forEach(k=>delete keys[k]);parts.length=0;
 S={name,t:0,walk:0,face:1,flash:0,inv:0,intro:1.2,stress:0,score:0,po:0,bug:0,inc:0,esc:0,n:0,n5:5,fz:0,hp:0,shake:0,uat:0,over:0,paused:0,pending:null,mash:null,done:{},
 p:{x:W/2,y:H-70},boss:{x:60,y:40,cool:0,blind:0,wt:0,w:{x:200,y:200}},pos:[],bugs:[],items:[],fx:[]};
}
const fx=(t,x,y,c)=>S.fx.push({t:0,txt:t,x,y,c:c||'#1c1f3a'});
function say(t){bn.textContent=t;bn.style.opacity=1;clearTimeout(bt);bt=setTimeout(()=>bn.style.opacity=0,2400)}
function show(h,fn){ov.innerHTML='<div class="card">'+h+'</div>';ov.style.display='flex';if(fn)fn(ov)}
function hide(){ov.style.display='none';ov.innerHTML=''}
function bind(el){el.querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>S.pending&&S.pending.f(+b.dataset.i))}
function hit(v,l){if(S.inv>0)return;S.inv=.7;hurt(v,l)}
function hurt(v,l){S.stress=Math.min(100,S.stress+v);S.shake=RM?0:.25;S.flash=.35;burst(S.p.x,S.p.y,'#e4472e',14);fx(l,S.p.x,S.p.y-26,'#e4472e');if(S.stress>=100)finish(0,'Stress เต็ม 100%! ขอลาป่วยไม่ทัน')}
const edge=()=>{const e=Math.random()*4|0,a=R(20,W-20),b=R(20,H-20);return e<1?{x:a,y:12}:e<2?{x:a,y:H-12}:e<3?{x:12,y:b}:{x:W-12,y:b}};
function spawnPO(){const e=edge();S.pos.push({x:e.x,y:e.y,w:1.2,vx:0,vy:0})}
function tick(){const s=S;s.n++;spawnPO();if(s.t>40&&Math.random()<.35)spawnPO();
 if(s.n%2==1)s.items.push({k:pick(IT),x:R(30,W-30),y:R(70,H-40),age:0});
 else{const n=1+(s.t/25|0)+(Math.random()<.4?1:0);for(let i=0;i<n;i++){const e=edge(),r=Math.random(),t=BT[r<.6?0:r<.9?1:2];s.bugs.push({x:e.x,y:e.y,age:0,...t})}}}
function take(k){const s=S,p=s.p;burst(p.x,p.y,CL[k],16);
 if(k==0){s.stress=Math.max(0,s.stress-25);fx('☕ Stress -25',p.x,p.y-26,'#1a8f4b')}
 else if(k==1){s.hp=7;fx('🎧 หัวหน้ามองไม่เห็น 7 วิ',p.x,p.y-26,'#4b53bc')}
 else if(k==2){s.fz=6;say('🚀 "กำลัง Deploy..." ทุกคนหยุดฟัง 6 วิ')}
 else{s.boss.blind=10;s.boss.w={x:R(30,W-30),y:R(40,200)};s.boss.wt=1.5;fx('📅 Meeting ปลอม: หัวหน้าหาไม่เจอ',p.x,p.y-26,'#4b53bc')}}

function choice(k){const e=EV[k];S.paused=1;S.pending={n:e.o.length,f:i=>resolve(k,i)};
 show(`<div class="big">${e.ic}</div><h2>${e.ti}</h2><p>${e.tx}</p>`+e.o.map((o,i)=>`<button data-i="${i}">${i+1}. ${o[0]}</button>`).join(''),bind)}
function resolve(k,i){const s=S;if(!s.pending)return;s.pending=null;
 const o=EV[k].o[i],ok=Math.random()<o[1];hide();s.paused=0;
 if(ok){s.inc++;s.score+=20+o[4];s.stress=Math.max(0,s.stress+o[3]);say('✅ '+o[2]);fx('Incident รอด! +'+(20+o[4]),s.p.x,s.p.y-26,'#1a8f4b')}
 else{say('💥 '+o[5]);hurt(o[6],'Stress +'+o[6])}}
function final(){S.paused=1;S.pending={n:3,f:fin};
 show('<div class="big">👔</div><h2>16:59 หัวหน้าปรากฏตัว!</h2><p>"พรุ่งนี้เช้าขอ Demo ลูกค้านะ"</p>'+['A. รับทราบครับ','B. ผมลาพรุ่งนี้ครับ','C. วิ่งออกประตู!'].map((t,i)=>`<button data-i="${i}">${t}</button>`).join(''),bind)}
function fin(i){if(!S.pending)return;S.pending=null;hide();
 if(i==0)finish(0,'"รับทราบครับ" ... แล้วก็นั่งทำ Demo ถึงดึก');
 else if(i==1){if(Math.random()<.5)finish(1,'ลาผ่าน! หัวหน้าอนุมัติแบบงงๆ');else finish(0,'หัวหน้า: "ลาไม่ได้ Demo สำคัญ"')}
 else mash()}
function mash(){const s=S,end=performance.now()+4000;let n=0,iv;
 show('<div class="big">🏃💨</div><h2>วิ่งออกประตู!</h2><p>กดปุ่มรัวๆ ให้ครบ 12 ครั้งใน 4 วินาที</p><button id="run" style="font-size:24px;padding:24px">วิ่ง!</button><p id="cn" class="dim">0 / 12</p>');
 const done=w=>{if(!s.mash)return;s.mash=null;clearInterval(iv);const b=w?Math.round(Math.max(0,end-performance.now())/12)+n*3:0;s.esc=b;
  finish(w,w?'คุณกลับบ้านได้สำเร็จ!':'วิ่งไม่ทัน หัวหน้าจับได้ที่ประตู',b)};
 s.mash=()=>{n++;$('cn').textContent=n+' / 12';if(n>=12)done(1)};
 $('run').onpointerdown=e=>{e.preventDefault();if(s.mash)s.mash()};
 iv=setInterval(()=>{if(performance.now()>=end)done(0)},50)}

function board(n,id){const a=load().sort((x,y)=>y.s-x.s).slice(0,n);
 return a.length?'<ol class="lb">'+a.map(r=>`<li${r.id===id?' class="me"':''}><span>${esc(r.n)}</span><span>${esc(r.k)} ${esc(r.s)}</span></li>`).join('')+'</ol>':'<p class="dim">ยังไม่มีคะแนน — ชื่อแรกบนบอร์ดเป็นของคุณได้</p>'}
function finish(win,msg,bonus=0){const s=S;if(s.over)return;s.over=1;s.paused=0;s.pending=null;s.mash=null;if(win&&!RM)for(let i=0;i<70;i++)parts.push({x:R(0,W),y:R(-80,0),vx:R(-30,30),vy:R(60,150),life:R(2.5,4),max:4,c:pick(['#ffd447','#4b53bc','#e4472e','#2bb3ff','#3fbf7f']),sz:R(3,6),g:30,r:1});
 const tot=s.score+Math.round(s.t)*2+bonus+(win?300+(100-s.stress)*3:0),rk=win?(tot>=800?RK[0]:RK[1]):(s.t>=30?RK[2]:RK[3]),id=Date.now();
 const a=load();a.push({id,n:s.name,s:tot,k:rk.e});a.sort((x,y)=>y.s-x.s);save(a.slice(0,50));
 show(`<div class="big">${win?'🏆':'💥'}</div><h2>${win?'VICTORY':'GAME OVER'}</h2><p>${msg}</p><p>${rk.e} <b>${rk.n}</b><br>"${rk.q}"</p><div class="score">${tot}</div>
<ul class="st"><li>Incident ที่รอด<b>${s.inc}</b></li><li>PO ที่หลบได้<b>${s.po}</b></li><li>Defect ที่ Won't Fix<b>${s.bug}</b></li><li>ความเร็วออกประตู<b>${s.esc}</b></li></ul>
<h3>Score board</h3>${board(8,id)}<button id="again">เล่นอีกครั้ง</button><button id="ren" class="alt">เปลี่ยนชื่อ</button>`,
 ()=>{$('again').onclick=()=>{newGame(s.name);hide()};$('ren').onclick=showStart})}
function showStart(pre){let nm=typeof pre=='string'?pre:'';if(typeof pre!='string'){try{nm=localStorage.getItem('office17-name')||''}catch(e){}}
 show(`<h1>17:00 Office Escape!</h1><p>ตอนนี้ 16:00 — เอาตัวรอดในออฟฟิศให้ครบ 60 วินาที แล้วกลับบ้านให้ได้</p><label for="nm">ชื่อผู้เล่น</label><input id="nm" maxlength="12" autocomplete="off" placeholder="ใส่ชื่อก่อนเริ่มเล่น" value="${esc(nm)}"><p id="er" class="er"></p><button id="go">เข้าออฟฟิศ</button><button id="rl" class="alt">กติกาการเล่น</button><p class="dim">ลากนิ้ว/เมาส์ หรือกด WASD เพื่อเดิน<br>หลบ 👔 หัวหน้า 🥷 PO 🐞 Defect · เก็บ ☕ 🎧 🚀 📅</p><h3>Score board</h3>${board(5)}`,
 ()=>{const go=()=>{const n=$('nm').value.trim();if(!n){$('er').textContent='ใส่ชื่อก่อนเริ่มเล่นนะ';$('nm').focus();return}
  try{localStorage.setItem('office17-name',n)}catch(e){}newGame(n);hide()};
  $('go').onclick=go;$('rl').onclick=()=>showRules($('nm').value);$('nm').onkeydown=e=>{if(e.key=='Enter')go()}})}
function showRules(nm){show(`<h2 style="margin-top:14px">กติกาการเล่น</h2><div class="rules">
<h3>เป้าหมาย</h3>
<ul><li>เริ่ม 16:00 เล่นจริง 60 วินาที (1 วินาที = 1 นาที) รอดให้ถึง 17:00 แล้ววิ่งออกจากออฟฟิศ</li><li>Stress เต็ม 100% = Game Over (เกมหยุดตอนต้องเลือกตัวเลือก)</li><li>Stress ลดลงเองวินาทีละ 1 และหลังโดนจะมีช่วงอมตะสั้นๆ (ตัวกะพริบ)</li></ul>
<h3>วิธีเล่น</h3>
<ul><li>ลากนิ้ว/เมาส์ให้ตัวละครเดินตาม หรือกด WASD / ลูกศร</li><li>ตัวเลือก: แตะ หรือกดเลข 1-3 · ตอนวิ่งออกประตู: แตะรัวๆ หรือกด Space</li></ul>
<h3>ศัตรู</h3>
<ul><li>👔 หัวหน้า: วิ่งไล่ตาม ถูกจับ Stress +15</li><li>🥷 PO Ninja: โผล่ตามขอบจอ (มี ⚠️ เตือนก่อน) แล้วพุ่งมาหา ชน = Backlog +3 (Stress +4) หลบพ้น +10 คะแนน</li><li>🐞 Defect: Minor +4 / Major +10 / Works on My Machine +16 Stress ไล่ตาม 6 วินาทีแล้วหายไป (Won't Fix +5 คะแนน)</li></ul>
<h3>ไอเท็ม (เดินไปชนเพื่อเก็บ หายเองใน 12 วินาที)</h3>
